# Pocket Library — every ebook, comic and manga in one place. Go + SQLite. One container, one volume, your book folders.
services:
  pocket-library:
    image: ghcr.io/abjelosevic88/pocket-homelab-library:latest   # :latest-calibre adds conversions (MOBI → EPUB, …)
    container_name: pocket-library
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Libraries made on the first start: Name[@books|comics|manga]=/folder[|/another]; more under Library admin.
      LIBRARIES: ${LIBRARIES:-Books=/books;Comics@comics=/comics;Manga@manga=/manga}
      # A folder to drop books into; they are filed into the uploads library.
      INGEST_DIR: ${INGEST_DIR:-/ingest}
      # Mail for Send to Kindle (changeable under Settings → Mail).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      KINDLE_EMAIL: ${KINDLE_EMAIL:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, links to Bookshelf and Day.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      - ./books:/books          # writable if you upload or use the ingest folder
      - ./comics:/comics
      - ./manga:/manga
      - ./ingest:/ingest
    extra_hosts:
      - "host.docker.internal:host-gateway"
